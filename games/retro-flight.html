<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Simorgh • Retro Flight</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#07101d;font-family:system-ui,Tahoma,sans-serif}body{display:grid;place-items:center}.wrap{width:min(430px,100vw);height:min(860px,100vh);position:relative;background:#8bd7ff;overflow:hidden}.hud{position:absolute;z-index:4;inset:12px 12px auto;display:flex;justify-content:space-between;color:#fff;font-weight:800;text-shadow:0 2px 4px #034}.title{position:absolute;z-index:4;top:46px;inset-inline:0;text-align:center;color:#fff;font-weight:900;font-size:24px;text-shadow:0 3px 8px #034}.canvas{width:100%;height:100%;display:block}.controls{position:absolute;z-index:5;bottom:15px;inset-inline:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}.controls button{pointer-events:auto;width:72px;height:56px;border:1px solid #ffffff77;border-radius:18px;background:#08213fcc;color:#fff;font-size:25px;font-weight:900;backdrop-filter:blur(6px)}.start{position:absolute;z-index:6;inset:0;display:grid;place-items:center;background:#03101dcc}.card{margin:20px;padding:24px;border:1px solid #ffffff33;border-radius:24px;background:#0c1930ee;color:#fff;text-align:center;box-shadow:0 20px 60px #0008}.card h1{margin-top:0}.card button{border:0;border-radius:14px;padding:13px 24px;background:#e8b64d;color:#211707;font-weight:900;font-size:16px}.hint{font-size:12px;opacity:.75;line-height:1.8}</style></head>
<body><div class="wrap"><canvas id="c" class="canvas"></canvas><div class="hud"><span>⭐ <b id="score">0</b></span><span>🚀 Retro Flight</span><span>⛽ <b id="fuel">100</b>%</span></div><div class="title">SIMORGH SKY DRIFT</div><div class="controls"><button id="left">◀</button><button id="right">▶</button></div><div class="start" id="start"><div class="card"><h1>✈️ پرواز سیمرغ</h1><p>یک آرکید پروازی سبک و غیررزمی؛ ستاره‌ها را جمع کن و از موانع طبیعی عبور کن.</p><p class="hint">کنترل با دکمه‌های روی صفحه یا کلیدهای ← →</p><button id="go">شروع بازی</button></div></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,dpr,run=false,score=0,fuel=100,x=0.5,speed=3,items=[],last=0,keys={};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function spawn(){const good=Math.random()<.72;items.push({x:.18+Math.random()*.64,y:-40,s:good?'⭐':'☁️',good})}
function draw(t){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#79cfff');sky.addColorStop(.55,'#d5f5ff');sky.addColorStop(1,'#4fc78c');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#3eae6d';ctx.beginPath();ctx.moveTo(0,H*.62);for(let i=0;i<=W;i+=55)ctx.lineTo(i,H*.62+Math.sin(i*.025+t*.0004)*28);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
items.forEach(o=>{o.y+=speed;ctx.font='32px serif';ctx.textAlign='center';ctx.fillText(o.s,o.x*W,o.y)});items=items.filter(o=>o.y<H+50);
const px=x*W,py=H*.76;ctx.save();ctx.translate(px,py);ctx.fillStyle='#f7f7f0';ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(8,5);ctx.lineTo(37,17);ctx.lineTo(9,20);ctx.lineTo(0,38);ctx.lineTo(-9,20);ctx.lineTo(-37,17);ctx.lineTo(-8,5);ctx.closePath();ctx.fill();ctx.fillStyle='#ef5350';ctx.fillRect(-5,-12,10,25);ctx.restore();
for(const o of items){if(o.y>py-35&&o.y<py+35&&Math.abs(o.x*W-px)<45){if(o.good){score++;fuel=Math.min(100,fuel+2)}else{fuel-=10}o.y=H+100}}document.getElementById('score').textContent=score;document.getElementById('fuel').textContent=Math.max(0,Math.round(fuel));if(fuel<=0){run=false;document.getElementById('start').style.display='grid';document.querySelector('.card p').textContent='سوخت تمام شد؛ امتیاز نهایی: '+score;return}}
function loop(t){if(!run)return;if(t-last>520){spawn();last=t}speed=3+Math.min(4,score*.03);if(keys.left)x=Math.max(.11,x-.012);if(keys.right)x=Math.min(.89,x+.012);draw(t);requestAnimationFrame(loop)}
function start(){score=0;fuel=100;x=.5;items=[];run=true;document.getElementById('start').style.display='none';requestAnimationFrame(loop)}document.getElementById('go').onclick=start;addEventListener('keydown',e=>{keys[e.key==='ArrowLeft'?'left':e.key==='ArrowRight'?'right':e.key]=1});addEventListener('keyup',e=>{keys[e.key==='ArrowLeft'?'left':e.key==='ArrowRight'?'right':e.key]=0});for(const [id,k] of [['left','left'],['right','right']]){const b=document.getElementById(id);b.onpointerdown=()=>keys[k]=1;b.onpointerup=b.onpointercancel=()=>keys[k]=0}
</script></body></html>
