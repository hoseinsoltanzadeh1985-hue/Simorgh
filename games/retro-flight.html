<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Simorgh • Retro Flight</title>
<style>
:root{--cyan:#20c8ff;--gold:#ffd84a;--panel:#07111ee8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020814;font-family:ui-monospace,monospace}body{display:grid;place-items:center}.wrap{width:min(460px,100vw);height:min(900px,100vh);position:relative;overflow:hidden;background:#1267b7;border:2px solid #164b78}.canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.hud{position:absolute;z-index:4;top:8px;left:8px;right:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;color:#fff;text-align:center;text-shadow:0 2px 0 #000}.hud .box{background:var(--panel);border:2px solid #1e6d9c;border-radius:10px;padding:5px 3px;font-size:11px}.hud b{display:block;font-size:18px;color:var(--gold)}.fuelbar{height:8px;background:#142335;border:1px solid #8094a8;border-radius:6px;overflow:hidden;margin-top:4px}.fuelbar i{display:block;height:100%;width:100%;background:#46df27;transition:width .1s}.brand{position:absolute;z-index:4;top:75px;left:0;right:0;text-align:center;color:#fff;font-size:19px;font-weight:900;letter-spacing:2px;text-shadow:0 3px 0 #08365c}.controls{position:absolute;z-index:5;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.controls button{pointer-events:auto;width:74px;height:58px;border:2px solid #65d7ff;border-radius:17px;background:#071b2de8;color:#fff;font-size:25px;font-weight:900}.controls button:active{transform:scale(.96)}.start{position:absolute;z-index:8;inset:0;display:grid;place-items:center;background:#020b16cc}.card{width:min(360px,90%);padding:24px;border:2px solid #2376a9;border-radius:22px;background:#071423f5;color:#fff;text-align:center;box-shadow:0 20px 70px #000b}.card h1{margin:0 0 8px;color:var(--gold);font-size:27px}.card p{font-family:system-ui,Tahoma,sans-serif;line-height:1.8;color:#d7e9f7}.card button{border:0;border-radius:14px;padding:13px 28px;background:#2fd24b;color:#06210b;font-weight:900;font-size:17px}.hint{font-size:12px!important;opacity:.7}.end{display:none}.telegram{position:absolute;z-index:6;bottom:86px;left:0;right:0;text-align:center;color:#dcecff;font-size:11px;opacity:.75}
</style></head>
<body><main class="wrap"><canvas id="c"></canvas><div class="hud"><div class="box">SCORE<b id="score">000000</b></div><div class="box">HI-SCORE<b id="hiscore">000000</b></div><div class="box">FUEL<b><span id="fuel">100</span>%</b><div class="fuelbar"><i id="fuelbar"></i></div></div></div><div class="brand">SIMORGH SKY DRIFT</div><div class="controls"><button id="left" aria-label="left">◀</button><button id="right" aria-label="right">▶</button></div><div class="telegram">✈️ Simorgh Mini App • arcade flight</div><section class="start" id="start"><div class="card"><h1>✈️ RETRO FLIGHT</h1><p id="message">یک آرکید پروازی غیررزمی با رودخانه، ستاره‌ها، سوخت و موانع طبیعی؛ الهام‌گرفته از ظاهر کلاسیک تصویر ارسالی.</p><p class="hint">کنترل: دکمه‌های روی صفحه یا ← →</p><button id="go">▶ شروع بازی</button></div></section></main>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1,run=false,x=.5,score=0,fuel=100,speed=2.6,last=0,spawnAt=0,items=[],keys={};
const $=id=>document.getElementById(id);let hi=Number(localStorage.getItem('simorghRetroHi')||0);$('hiscore').textContent=String(hi).padStart(6,'0');
function tg(){try{const w=window.Telegram?.WebApp;if(w){w.ready();w.expand();}}catch(e){}}
tg();
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function spawn(){const r=Math.random();let type=r<.58?'star':r<.78?'fuel':r<.9?'rock':'bridge';items.push({x:.12+Math.random()*.76,y:-55,type,hit:false})}
function river(t){const top=H*.12, left=70+Math.sin(t*.00045)*22, right=W-70+Math.sin(t*.00035+2)*20;ctx.fillStyle='#1571c7';ctx.fillRect(0,top,W,H-top);ctx.fillStyle='#176a37';ctx.fillRect(0,top,left-28,H);ctx.fillRect(right+28,top,W-right-28,H);ctx.fillStyle='#35a95b';ctx.fillRect(0,top,left-35,H);ctx.fillRect(right+35,top,W-right-35,H);ctx.fillStyle='#b98a55';ctx.fillRect(left-10,top,12,H);ctx.fillRect(right-2,top,12,H);for(let y=top+20;y<H;y+=44){ctx.fillStyle='#59bce8';ctx.fillRect((y*7)%W,y,18,3);ctx.fillRect((y*13+80)%W,y+12,10,2)}}
function drawPlane(px,py){ctx.save();ctx.translate(px,py);ctx.fillStyle='#ffe02f';ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(10,7);ctx.lineTo(39,18);ctx.lineTo(11,23);ctx.lineTo(0,40);ctx.lineTo(-11,23);ctx.lineTo(-39,18);ctx.lineTo(-10,7);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-5,-13,10,25);ctx.restore()}
function drawItem(o){ctx.font='31px serif';ctx.textAlign='center';const s=o.type==='star'?'⭐':o.type==='fuel'?'⛽':o.type==='rock'?'🪨':'🌉';ctx.fillText(s,o.x*W,o.y)}
function frame(t){if(!run)return;ctx.clearRect(0,0,W,H);river(t);if(t-last>spawnAt){spawn();last=t;spawnAt=360+Math.random()*420}for(const o of items){o.y+=speed;drawItem(o)}items=items.filter(o=>o.y<H+70);const px=x*W,py=H*.76;drawPlane(px,py);for(const o of items){if(o.hit)continue;if(Math.abs(o.x*W-px)<43&&Math.abs(o.y-py)<38){o.hit=true;if(o.type==='star'){score+=100;fuel=Math.min(100,fuel+1)}else if(o.type==='fuel'){score+=50;fuel=Math.min(100,fuel+18)}else if(o.type==='rock'){fuel-=12}else{fuel-=18}}}score+=1;fuel-=.035;speed=2.6+Math.min(3,score/6000);$('score').textContent=String(Math.floor(score)).padStart(6,'0');$('fuel').textContent=Math.max(0,Math.ceil(fuel));$('fuelbar').style.width=Math.max(0,fuel)+'%';if(score>hi){hi=Math.floor(score);localStorage.setItem('simorghRetroHi',hi);$('hiscore').textContent=String(hi).padStart(6,'0')}if(fuel<=0){endGame('سوخت تمام شد. امتیاز نهایی: '+Math.floor(score));return}if(keys.left)x=Math.max(.12,x-.012);if(keys.right)x=Math.min(.88,x+.012);requestAnimationFrame(frame)}
function endGame(text){run=false;$('message').textContent=text;$('go').textContent='↻ بازی دوباره';$('start').style.display='grid'}
function start(){score=0;fuel=100;x=.5;items=[];last=performance.now();spawnAt=300;run=true;$('start').style.display='none';requestAnimationFrame(frame)}
$('go').onclick=start;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')e.preventDefault();keys[e.key==='ArrowLeft'?'left':e.key==='ArrowRight'?'right':e.key]=1});addEventListener('keyup',e=>{keys[e.key==='ArrowLeft'?'left':e.key==='ArrowRight'?'right':e.key]=0});for(const [id,k] of [['left','left'],['right','right']]){const b=$(id);b.onpointerdown=()=>keys[k]=1;b.onpointerup=b.onpointercancel=()=>keys[k]=0;b.onpointerleave=()=>keys[k]=0}
</script></body></html>
